name: Wiki

# The GitHub Wiki is made from docs/ (tools/docs_to_wiki.py). Edit docs/, not the wiki:
# every push to main rewrites the wiki's pages.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "LAYOUT.md"
      - "tools/docs_to_wiki.py"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the wiki
        run: git clone "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git" wiki
      - name: Build the pages
        run: |
          find wiki -maxdepth 1 -name '*.md' -delete
          python3 tools/docs_to_wiki.py wiki
      - name: Push
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "The wiki is up to date."; exit 0; fi
          git commit -m "Update from docs/ at ${GITHUB_SHA::7}"
          git push
