name: Release

# Push a tag (git tag v1.3.0 && git push origin v1.3.0) to build every download and make a draft
# release. Signing and notarization happen when the secrets in docs/developers/signing.md are set.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    name: Mac and Windows exes
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: windows/go.mod
      - name: Check the tag matches the Makefile
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want=$(sed -n 's/^VERSION *:= *//p' Makefile)
          [ "${GITHUB_REF_NAME#v}" = "$want" ] || { echo "Tag $GITHUB_REF_NAME but Makefile VERSION is $want"; exit 1; }
      - name: Import signing certificates
        id: certs
        env:
          P12: ${{ secrets.MACOS_CERTS_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "No signing certificates: building ad-hoc signed."; exit 0; fi
          kc="$RUNNER_TEMP/qalam.keychain-db"
          security create-keychain -p ci "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p ci "$kc"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security import "$RUNNER_TEMP/certs.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certs.p12"
          if [ -n "$APPLE_ID" ]; then
            xcrun notarytool store-credentials qalam --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$kc"
            echo "notary=qalam" >> "$GITHUB_OUTPUT"
          fi
          echo "signed=yes" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          SIGN_ID: ${{ steps.certs.outputs.signed && secrets.MACOS_SIGN_ID || '-' }}
          INSTALLER_ID: ${{ steps.certs.outputs.signed && secrets.MACOS_INSTALLER_ID || '' }}
          NOTARY_PROFILE: ${{ steps.certs.outputs.notary }}
        run: make release SIGN_ID="$SIGN_ID" INSTALLER_ID="$INSTALLER_ID" NOTARY_PROFILE="$NOTARY_PROFILE"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-and-exes
          path: |
            dist/
            Casks/qalam.rb

  windows:
    name: Windows installers
    needs: mac
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mac-and-exes
          path: built
      - name: Get Inno Setup
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Sign the exes
        env:
          PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:PFX) { "No Windows certificate: the exes stay unsigned."; exit 0 }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          "SIGNTOOL=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $signtool.FullName sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:PFX_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 built\dist\Qalam-Windows-x64.exe built\dist\Qalam-Windows-arm64.exe
          if ($LASTEXITCODE -ne 0) { throw "signing failed" }
      - name: Build the installers
        working-directory: windows/installer
        run: |
          $version = (Select-String -Path ..\..\Makefile -Pattern '^VERSION\s*:=\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          foreach ($arch in 'x64', 'arm64') {
            & $env:ISCC /Q "/DAppVersion=$version" "/DArch=$arch" "/DExe=..\..\built\dist\Qalam-Windows-$arch.exe" "/DOutDir=..\..\built\dist" qalam.iss
            if ($LASTEXITCODE -ne 0) { throw "iscc failed for $arch" }
          }
      - name: Sign the installers
        if: env.SIGNTOOL != ''
        env:
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          & $env:SIGNTOOL sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:PFX_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 built\dist\Qalam-Setup-x64.exe built\dist\Qalam-Setup-arm64.exe
          if ($LASTEXITCODE -ne 0) { throw "signing failed" }
      - name: Smoke-test the x64 installer
        run: |
          Start-Process built\dist\Qalam-Setup-x64.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=""' -Wait
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\Qalam\Qalam.exe")) { throw "not installed" }
          Start-Process "$env:LOCALAPPDATA\Programs\Qalam\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait
      - name: Checksums
        working-directory: built/dist
        run: |
          Get-ChildItem -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: built/dist/

  publish:
    name: Draft the release
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^VERSION *:= *//p' Makefile)
          gh release create "v$version" dist/* --draft --title "Qalam $version" --generate-notes --verify-tag || \
            gh release upload "v$version" dist/* --clobber
          sha=$(sha256sum dist/Qalam-mac.zip | cut -d' ' -f1)
          {
            echo "### Draft release v$version is ready"
            echo
            echo "Check it, then publish it on the Releases page. Then update \`Casks/qalam.rb\`:"
            echo
            echo '```ruby'
            echo "  version \"$version\""
            echo "  sha256 \"$sha\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
