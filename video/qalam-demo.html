<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Qalam Demo Video</title>
<!--
  The Qalam demo video, as an animation. The narration is video/script.json; each scene lasts as long
  as its voice clip (render.js measures video/voice/NN.mp3 and calls setVoiceDurations), so picture,
  voice and subtitles stay together whatever the voice's pace. Without clips, durations are estimated.
  Every frame is drawn from a time t by renderAt(t). The Arabic comes from the real Qalam engine.
  Watch it live: serve the repository (python3 -m http.server) and open /video/qalam-demo.html
-->
<style>

    box-shadow: 0 30px 80px rgba(20,40,30,.18); overflow: hidden; }

<body>
<div id="stage"></div>

<script src="../website/demo/wasm_exec.js"></script>
<script>
// ---------- Timing ----------
// Scene i lasts LEAD + narration i + TAIL (or its minimum). The voice starts LEAD after the scene starts.
const LEAD = 0.5, TAIL = 0.8;
const MIN = { intro: 5, end: 6 };
const HOLD_END = 1.5;      // the end card stays a moment after the last word
let SCRIPT = null, DUR = [], TL = [], SUBS = [], DURATION = 0;

function buildTimeline() {
  TL = []; SUBS = [];
  let t = 0;
  SCRIPT.scenes.forEach((s, i) => {
    const words = s.say.split(/\s+/).length;
    const voice = DUR[i] != null ? DUR[i] : words / 2.3;
    const extra = i === 0 ? 0.5 : 0;
    const lead = LEAD + extra;
    let len = Math.max(lead + voice + TAIL, MIN[s.id] || 3);
    if (i === SCRIPT.scenes.length - 1) len += HOLD_END;
    TL.push({ id: s.id, start: t, len, voiceStart: t + lead, voiceLen: voice });
    // Subtitles: the line in sentences, each shown for its share of the narration (by length).
    const parts = splitSentences(s.show);
    const total = parts.reduce((a, p) => a + p.length, 0);
    let at = t + lead;
    parts.forEach((p, j) => {
      const d = voice * p.length / total;
      SUBS.push({ scene: i, part: j, start: at, end: j === parts.length - 1 ? t + lead + voice + 0.3 : at + d, text: p });
      at += d;
    });
    t += len;
  });
  DURATION = t;
}

// Sentences, and long ones split at a comma, so a subtitle stays on one or two lines.
function splitSentences(text) {
  const out = [];
  for (const s of text.match(/[^.?!]+[.?!]+(\s|$)|[^.?!]+$/g).map((x) => x.trim()).filter(Boolean)) {
    if (s.length <= 95) { out.push(s); continue; }
    const mid = s.length / 2;
    let best = -1;
    for (let k = s.indexOf(","); k >= 0; k = s.indexOf(",", k + 1)) if (best < 0 || Math.abs(k - mid) < Math.abs(best - mid)) best = k;
    if (best < 0) { out.push(s); continue; }
    out.push(s.slice(0, best + 1).trim(), s.slice(best + 1).trim());
  }
  return out;
}

// ---------- Helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const opts = (o = {}) => Object.assign({ style: "everyday", harakat: "full", sukun: "smart", spelling: true, digits: false }, o);
const T = (s, o) => qalam.text(s, opts(o));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function fade(t, a, b, d = 0.35) { return Math.min(ease((t - a) / d), ease((b - t) / d)); }
const $ = (sel, el = document) => el.querySelector(sel);

// Typing `script` between local times a and b: what's on screen at u.
function typing(script, a, b, u, o) {
  const cps = script.length / Math.max(b - a, 0.1);
  const n = clamp(Math.floor((u - a) * cps), 0, script.length);
  const typed = script.slice(0, n);
  const cut = typed.lastIndexOf(" ") + 1;
  const done = typed.slice(0, cut), buffer = typed.slice(cut);
  const cands = buffer ? qalam.candidates(buffer, opts(o)) : [];
  const last = n > 0 ? script[n - 1] : "";
  const sinceKey = n > 0 ? u - (a + (n - 1) / cps) : 99;
  return { n, committed: done ? T(done, o) : "", buffer, cands, last, sinceKey, preview: cands[0] ? cands[0].text : buffer };
}

function editor(el, text, preview, caret = true) {
  el.textContent = text;
  if (preview) { const w = document.createElement("span"); w.className = "word"; w.textContent = preview; el.append(w); }
  if (caret) { const c = document.createElement("span"); c.className = "caret"; el.append(c); }
}

function keyLabel(ch) { return ch === " " ? "Space" : ch; }
let keysNow = [], hintNow = "";
function keys(list, hint = "") { keysNow = list; hintNow = hint; }

const WINDOW = (title, chipsHTML = "") => `<div class="window"><div class="bar"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span><span class="title">${title}</span><div class="chips">${chipsHTML}</div></div><div class="doc"><div class="text"></div><div class="latin"></div><div class="note"></div></div></div>`;
function chips(el, style, sukun, harakat, flash = "") {
  el.querySelector(".chips").innerHTML =
    `<span class="chip ${style === "quran" ? "on" : ""} ${flash === "style" ? "flash" : ""}">${style === "quran" ? "Qur'an style" : "Everyday"}</span>` +
    `<span class="chip ${flash === "sukun" ? "flash" : ""}">Sukūn: ${{ smart: "Smart", full: "Full", off: "Off" }[sukun]}</span>` +
    `<span class="chip ${flash === "harakat" ? "flash" : ""}">Harakat: ${harakat === "none" ? "Off" : "On"}</span>`;
}
function latin(el, buffer) { el.querySelector(".latin").innerHTML = buffer ? `typed: <b>${esc(buffer)}</b>` : ""; }

const SIDEBAR = (on) => `<div class="side">${["Welcome", "Letters & keys", "Word list", "Practice", "Write", "Settings"].map((p) => `<div class="${p === on ? "on" : ""}">${p}</div>`).join("")}</div>`;
const APP = (inner, on = "Settings") => `<div class="app"><div class="bar"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span><span class="title">Qalam</span></div>${SIDEBAR(on)}<div class="main">${inner}</div><div class="banner"></div><div class="cursor"></div></div>`;

function cursor(el, x, y, show = true) {
  const c = el.querySelector(".cursor");
  c.style.opacity = show ? 1 : 0;
  c.style.left = x + "px"; c.style.top = y + "px";
}
const lerp = (a, b, k) => a + (b - a) * ease(k);

// Times of this scene's subtitle sentences, relative to the scene start.
function parts(i) { return SUBS.filter((s) => s.scene === i).map((s) => ({ a: s.start - TL[i].start, b: s.end - TL[i].start })); }

// ---------- Scenes ----------
// Each scene: build(el) once, then draw(el, u, len, i) every frame (u = seconds since the scene started).
const SCENES = {
  intro: {
    build: (el) => el.innerHTML = `<div class="center"><div class="logo">قَلَم</div><div class="name">Qalam</div><div class="tag">Type Arabic the way you spell it</div><div class="example"></div></div>`,
    draw(el, u, len) {
      $(".logo", el).style.transform = `scale(${0.85 + 0.15 * ease(u / 0.9)})`;
      const ex = ["kitaAbuN", "eilmuN", "madrasat'uN", "alshamsu"];
      const k = Math.min(ex.length - 1, Math.floor(u / (len / ex.length)));
      const local = u - k * (len / ex.length);

// ---------- Drawing a frame ----------
const els = [];
function build() {
  const stage = document.getElementById("stage");
  stage.innerHTML = "";
  TL.forEach((s) => {
    const el = document.createElement("div");
    el.className = "scene";
    SCENES[s.id].build(el);
    stage.append(el);
    els.push(el);
  });
  stage.insertAdjacentHTML("beforeend", `<div class="keys" id="keys"></div><div class="sub" id="sub"></div><div class="progress" id="progress"></div>`);
}

function renderAt(t) {
  keys([]);
  TL.forEach((s, i) => {
    const vis = fade(t, s.start, s.start + s.len + (i === TL.length - 1 ? 9 : 0.2), 0.35);
    els[i].style.opacity = vis;
    if (t >= s.start - 0.4 && t < s.start + s.len + 0.4) SCENES[s.id].draw(els[i], t - s.start, s.len, i);
  });
  // Keys belong to whichever scene is current.
  const cur = TL.findIndex((s) => t >= s.start && t < s.start + s.len);
  if (cur >= 0) SCENES[TL[cur].id].draw(els[cur], t - TL[cur].start, TL[cur].len, cur);
  const k = document.getElementById("keys");
  k.innerHTML = keysNow.map(([label, down]) => `<span class="key ${down ? "down" : ""}">${esc(label)}</span>`).join("") + (hintNow ? `<span class="hint">${esc(hintNow)}</span>` : "");
  k.style.opacity = keysNow.length ? 1 : 0;
  const sub = SUBS.find((s) => t >= s.start && t < s.end);
  const subEl = document.getElementById("sub");
  subEl.innerHTML = sub ? `<span>${esc(sub.text)}</span>` : "";
  subEl.style.opacity = sub ? fade(t, sub.start, sub.end, 0.15) : 0;
  document.getElementById("progress").style.width = (t / DURATION * 100) + "%";
}

// render.js: the real narration lengths (seconds), then the timeline it should follow.
window.setVoiceDurations = (d) => { DUR = d; buildTimeline(); els.length = 0; build(); renderAt(0);
  return { duration: DURATION, scenes: TL, subtitles: SUBS }; };
window.renderAt = renderAt;

window.videoReady = new Promise((resolve) => {
  window.addEventListener("qalam-ready", async () => {
    SCRIPT = await (await fetch("script.json")).json();
    buildTimeline();
    build();
    await document.fonts.ready;
    await Promise.all(["Naskh", "AmiriQ", "Scheh", "NSans"].map((f) => document.fonts.load(`40px "${f}"`, "قلم")));
    renderAt(0);
    resolve(true);
    if (!location.search.includes("capture")) {
      const start = performance.now();
      const loop = () => { renderAt(((performance.now() - start) / 1000) % DURATION); requestAnimationFrame(loop); };
      requestAnimationFrame(loop);
    }
  }, { once: true });
});
const go = new Go();
fetch("../website/demo/qalam.wasm").then((r) => r.arrayBuffer()).then((b) => WebAssembly.instantiate(b, go.importObject)).then((r) => go.run(r.instance));
</script>
